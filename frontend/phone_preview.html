<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Agenda Phone Preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e8ece7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .phone {
      width: 430px;
      max-width: calc(100vw - 24px);
      padding: 14px;
      border-radius: 38px;
      background: #111827;
      box-shadow: 0 24px 70px rgba(17, 24, 39, 0.28);
    }

    .speaker {
      width: 86px;
      height: 5px;
      margin: 0 auto 10px;
      border-radius: 999px;
      background: #374151;
    }

    iframe {
      width: 390px;
      max-width: 100%;
      height: 844px;
      border: 0;
      border-radius: 26px;
      overflow: hidden;
      background: #ffffff;
    }

    .label {
      margin-top: 10px;
      color: #f9fafb;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="phone">
    <div class="speaker"></div>
    <iframe src="http://127.0.0.1:8081/" title="Pocket Agenda mobile preview"></iframe>
    <div class="label">390 x 844 phone preview</div>
  </main>
</body>
</html>
